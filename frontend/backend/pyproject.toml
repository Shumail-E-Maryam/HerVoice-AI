[project]
name = "hervoice-ai-backend"
version = "1.0.0"
description = "HerVoice AI FastAPI backend"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0"
]

[tool.setuptools]
py-modules = ["main"]

[tool.fastapi]
entrypoint = "main:app"